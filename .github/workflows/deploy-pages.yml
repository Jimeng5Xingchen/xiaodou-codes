name: 采集并部署 GitHub Pages

# 单仓库结构：源码与本仓库的 GitHub Pages 共用同一个仓库。
# 每次运行：拉取源码 → 执行采集器 → 生成静态快照 → 构建站点 → 官方 Pages 动作发布。
# 不再依赖第二个公开仓库，也不再需要 PAT。

on:
  schedule:
    # 每 30 分钟采集一次（GitHub Actions 定时任务，最小间隔 5 分钟）
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      skip_collect:
        description: '跳过采集，仅用已有快照重新构建'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'app.py'
      - 'auth.py'
      - 'admin.py'
      - 'db.py'
      - 'mailer.py'
      - 'mcp_*.py'
      - '*.py'
      - 'static/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 采集 · 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行多源采集
        if: ${{ !inputs.skip_collect }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, sys, traceback
          sys.path.insert(0, '.')
          try:
              import collector
              payload = collector.run_once()
          except Exception:
              traceback.print_exc()
              # 采集失败不应中断发布：沿用仓库内的基线快照
              payload = None
          if payload:
              with open('data/codes.json', 'w', encoding='utf-8') as fh:
                  json.dump(payload, fh, ensure_ascii=False)
              print('采集完成:', json.dumps(payload.get('counts', {}), ensure_ascii=False))
              print('采集告警:', payload.get('errors', []))
          else:
              print('采集失败，沿用仓库内基线快照 data/codes.json')
          PY

      - name: 准备快照文件
        run: |
          mkdir -p data
          if [ ! -s data/codes.json ]; then
            echo '{"codes":[],"counts":{"total":0},"errors":["尚无采集快照"],"lastUpdated":""}' > data/codes.json
          fi

      - name: 构建站点产物
        env:
          XD_API_BASE: ${{ vars.XD_API_BASE }}
          XD_SHARECODE: ${{ vars.XD_SHARECODE }}
        run: python3 scripts/build_pages.py --out site

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 发布 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
